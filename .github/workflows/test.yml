name: test

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  PYTHONUTF8: 1
  PYTHONDONTWRITEBYTECODE: 1

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.9', '3.12']
        exclude:
          - os: ubuntu-latest
            python-version: '3.9'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run unit and release tests
        run: python -m unittest discover -s tests -v
      - name: Parse PowerShell script
        shell: pwsh
        run: |
          $errors = @()
          [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path "skills/privacy-fortress/scripts/killswitch.ps1"), [ref]$null, [ref]$errors)
          if ($errors.Count -gt 0) { $errors | Out-String | Write-Error; exit 1 }
      - name: Lint bundled gateway example
        run: python skills/privacy-fortress/scripts/lint_gateway.py skills/privacy-fortress/assets/mihomo.example.yaml
      - name: Run offline audit
        run: python skills/privacy-fortress/scripts/privacy_audit.py --output ./privacy-reports
      - name: Validate 30-control coverage ledger
        run: |
          python skills/privacy-fortress/scripts/coverage_audit.py --list
          python skills/privacy-fortress/scripts/coverage_audit.py --init ./privacy-reports/coverage.json
          python skills/privacy-fortress/scripts/coverage_audit.py --ledger ./privacy-reports/coverage.json --output ./privacy-reports/coverage.md
      - name: Preview Windows firewall targets
        if: matrix.os == 'windows-latest'
        run: |
          powershell -NoProfile -File skills/privacy-fortress/scripts/killswitch.ps1 -Action Plan -ConfigPath skills/privacy-fortress/assets/killswitch-targets.example.json
          powershell -NoProfile -File skills/privacy-fortress/scripts/killswitch.ps1 -Action Plan -ConfigPath skills/privacy-fortress/assets/killswitch-program-target.example.json
      - name: Validate and package skill
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        run: |
          python tools/package_skill.py --check
          python tools/package_skill.py
          python tools/package_skill.py --output dist/privacy-fortress.zip
